<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            bgLight: '#f8fafd',
                            bgDark: '#131314',
                            sidebarLight: '#f0f4f9',
                            sidebarDark: '#1e1f20',
                            cardLight: '#ffffff',
                            cardDark: '#28292a',
                            borderLight: '#e3e3e3',
                            borderDark: '#37393b',
                            accent: '#1a73e8'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Marked.js for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for Code Formatting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* Fallback loader styles */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafd;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 1.25rem;
            color: #1f2937;
            z-index: 9999;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }

        /* Markdown Styles */
        .prose pre {
            background-color: #1e1e1e !important;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            overflow-x: auto;
        }
        .prose code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875em;
        }
        .prose p {
            margin-bottom: 0.75rem;
            line-height: 1.6;
        }
        .prose p:last-child {
            margin-bottom: 0;
        }
        .prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }

        /* Cursor Animation for Streaming */
        .cursor-blink::after {
            content: '▋';
            display: inline-block;
            animation: blink 1s infinite;
            margin-left: 2px;
            color: #1a73e8;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="h-full bg-gemini-bgLight dark:bg-gemini-bgDark text-gray-800 dark:text-gray-100 flex flex-col font-sans transition-colors duration-200">

    <!-- Fallback Loader -->
    <div id="loading">Loading App...</div>

    <!-- App Root Container -->
    <div id="app" class="hidden flex-1 flex h-full overflow-hidden relative">

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-20 hidden md:hidden"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-30 w-72 bg-gemini-sidebarLight dark:bg-gemini-sidebarDark border-r border-gemini-borderLight dark:border-gemini-borderDark flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
            <!-- Sidebar Header -->
            <div class="p-4 flex items-center justify-between">
                <button id="btn-new-chat" class="flex-1 flex items-center gap-3 px-4 py-3 bg-gemini-cardLight dark:bg-gemini-cardDark border border-gemini-borderLight dark:border-gemini-borderDark rounded-full text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                    <svg class="w-5 h-5 text-gemini-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    New Chat
                </button>
                <button id="btn-close-sidebar" class="md:hidden p-2 text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Chat History List -->
            <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="chat-list">
                <!-- Chat list items dynamically rendered here -->
            </div>

            <!-- Sidebar Footer Controls -->
            <div class="p-3 border-t border-gemini-borderLight dark:border-gemini-borderDark space-y-1">
                <button id="btn-open-settings" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-gray-200/60 dark:hover:bg-gray-700/60 transition">
                    <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Settings
                </button>
                <button id="btn-toggle-dark" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm hover:bg-gray-200/60 dark:hover:bg-gray-700/60 transition">
                    <svg id="theme-icon-dark" class="w-5 h-5 text-gray-500 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <svg id="theme-icon-light" class="w-5 h-5 text-gray-500 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                    <span id="theme-text">Dark Mode</span>
                </button>
            </div>
        </aside>

        <!-- Main View Area -->
        <main class="flex-1 flex flex-col min-w-0 h-full relative">
            <!-- Top Navbar -->
            <header class="h-14 border-b border-gemini-borderLight dark:border-gemini-borderDark flex items-center justify-between px-4 bg-gemini-bgLight dark:bg-gemini-bgDark shrink-0">
                <div class="flex items-center gap-3">
                    <button id="btn-open-sidebar" class="md:hidden p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700">
                        <svg class="w-6 h-6 text-gray-600 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <h1 class="font-semibold text-lg tracking-tight bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent">Universal AI</h1>
                </div>
                <div class="text-xs px-2.5 py-1 rounded-full bg-gray-200/70 dark:bg-gray-800 text-gray-600 dark:text-gray-400 font-mono" id="current-model-tag">
                    deepseek/deepseek-r1:free
                </div>
            </header>

            <!-- Chat Messages Container -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                <!-- Dynamic messages go here -->
            </div>

            <!-- Floating / Sticky Input Bar -->
            <div class="p-3 md:p-4 bg-gemini-bgLight dark:bg-gemini-bgDark border-t border-gemini-borderLight dark:border-gemini-borderDark shrink-0">
                <div class="max-w-3xl mx-auto relative">
                    <form id="chat-form" class="relative flex items-end bg-gemini-cardLight dark:bg-gemini-cardDark border border-gemini-borderLight dark:border-gemini-borderDark rounded-2xl shadow-sm focus-within:ring-2 focus-within:ring-gemini-accent focus-within:border-transparent transition-all">
                        <textarea 
                            id="user-input" 
                            rows="1" 
                            placeholder="Message AI..." 
                            class="w-full pl-4 pr-12 py-3 bg-transparent resize-none border-0 focus:ring-0 focus:outline-none max-h-36 min-h-[48px] text-sm md:text-base leading-relaxed text-gray-800 dark:text-gray-100 placeholder-gray-400"
                        ></textarea>
                        <button 
                            type="submit" 
                            id="btn-send"
                            class="absolute right-2 bottom-2 p-2 rounded-xl bg-gemini-accent text-white hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed transition"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        </button>
                    </form>
                    <div class="text-[10px] text-center text-gray-400 mt-2">AI may display inaccurate info. Check important facts.</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gemini-cardLight dark:bg-gemini-cardDark w-full max-w-md rounded-2xl p-6 shadow-xl border border-gemini-borderLight dark:border-gemini-borderDark space-y-5">
            <div class="flex justify-between items-center border-b border-gemini-borderLight dark:border-gemini-borderDark pb-3">
                <h3 class="text-lg font-semibold">Settings</h3>
                <button id="btn-close-settings" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">OpenRouter API Key</label>
                    <input type="password" id="input-api-key" placeholder="sk-or-v1-..." class="w-full px-3 py-2 bg-gemini-bgLight dark:bg-gemini-bgDark border border-gemini-borderLight dark:border-gemini-borderDark rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gemini-accent">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Model Name</label>
                    <input type="text" id="input-model" placeholder="deepseek/deepseek-r1:free" class="w-full px-3 py-2 bg-gemini-bgLight dark:bg-gemini-bgDark border border-gemini-borderLight dark:border-gemini-borderDark rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gemini-accent">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">Global System Prompt</label>
                    <textarea id="input-system-prompt" rows="3" placeholder="You are a helpful assistant..." class="w-full px-3 py-2 bg-gemini-bgLight dark:bg-gemini-bgDark border border-gemini-borderLight dark:border-gemini-borderDark rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gemini-accent resize-none"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button id="btn-save-settings" class="px-4 py-2 bg-gemini-accent text-white text-sm font-medium rounded-lg hover:opacity-90 transition">Save & Close</button>
            </div>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script>
        (function() {
            // Defensive setup for dependencies
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
                            try { return hljs.highlight(code, { language: lang }).value; } catch (e) {}
                        }
                        return code;
                    },
                    breaks: true
                });
            }

            // Application State Object
            const state = {
                apiKey: localStorage.getItem('app_api_key') || '',
                model: localStorage.getItem('app_model') || 'deepseek/deepseek-r1:free',
                systemPrompt: localStorage.getItem('app_system_prompt') || 'You are a helpful AI assistant.',
                darkMode: localStorage.getItem('app_dark_mode') === 'true',
                chats: JSON.parse(localStorage.getItem('app_chats') || '[]'),
                activeChatId: localStorage.getItem('app_active_chat_id') || null,
                isGenerating: false
            };

            // DOM Elements Reference Object
            const elements = {
                loading: document.getElementById('loading'),
                app: document.getElementById('app'),
                sidebar: document.getElementById('sidebar'),
                sidebarOverlay: document.getElementById('sidebar-overlay'),
                btnOpenSidebar: document.getElementById('btn-open-sidebar'),
                btnCloseSidebar: document.getElementById('btn-close-sidebar'),
                btnNewChat: document.getElementById('btn-new-chat'),
                chatList: document.getElementById('chat-list'),
                messagesContainer: document.getElementById('messages-container'),
                chatForm: document.getElementById('chat-form'),
                userInput: document.getElementById('user-input'),
                btnSend: document.getElementById('btn-send'),
                btnOpenSettings: document.getElementById('btn-open-settings'),
                btnCloseSettings: document.getElementById('btn-close-settings'),
                btnSaveSettings: document.getElementById('btn-save-settings'),
                settingsModal: document.getElementById('settings-modal'),
                inputApiKey: document.getElementById('input-api-key'),
                inputModel: document.getElementById('input-model'),
                inputSystemPrompt: document.getElementById('input-system-prompt'),
                btnToggleDark: document.getElementById('btn-toggle-dark'),
                currentModelTag: document.getElementById('current-model-tag')
            };

            // Storage Helpers
            function saveState() {
                try {
                    localStorage.setItem('app_api_key', state.apiKey);
                    localStorage.setItem('app_model', state.model);
                    localStorage.setItem('app_system_prompt', state.systemPrompt);
                    localStorage.setItem('app_dark_mode', state.darkMode);
                    localStorage.setItem('app_chats', JSON.stringify(state.chats));
                    localStorage.setItem('app_active_chat_id', state.activeChatId || '');
                } catch (e) {
                    console.error("Storage save failed:", e);
                }
            }

            // App Initialization
            function init() {
                // Apply Theme
                if (state.darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }

                // Ensure initial active chat exists
                if (!state.chats.length) {
                    createNewChat();
                } else if (!state.activeChatId || !state.chats.find(c => c.id === state.activeChatId)) {
                    state.activeChatId = state.chats[0].id;
                }

                elements.currentModelTag.textContent = state.model;
                renderChatList();
                renderMessages();

                // Unhide Application interface
                if (elements.loading) elements.loading.style.display = 'none';
                if (elements.app) elements.app.classList.remove('hidden');

                // Auto-resize input height on input
                elements.userInput.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 144) + 'px';
                });

                // Enter Key Submit logic
                elements.userInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        elements.chatForm.dispatchEvent(new Event('submit'));
                    }
                });
            }

            // Chat Operations
            function createNewChat() {
                const newChat = {
                    id: 'chat_' + Date.now(),
                    title: 'New Conversation',
                    messages: []
                };
                state.chats.unshift(newChat);
                state.activeChatId = newChat.id;
                saveState();
                renderChatList();
                renderMessages();
                closeSidebarMobile();
            }

            function getActiveChat() {
                return state.chats.find(c => c.id === state.activeChatId) || null;
            }

            function deleteChat(id, e) {
                e.stopPropagation();
                state.chats = state.chats.filter(c => c.id !== id);
                if (state.activeChatId === id) {
                    state.activeChatId = state.chats.length ? state.chats[0].id : null;
                }
                if (!state.chats.length) {
                    createNewChat();
                } else {
                    saveState();
                    renderChatList();
                    renderMessages();
                }
            }

            function renameChat(id, e) {
                e.stopPropagation();
                const chat = state.chats.find(c => c.id === id);
                if (!chat) return;
                const newTitle = prompt('Rename Chat:', chat.title);
                if (newTitle && newTitle.trim()) {
                    chat.title = newTitle.trim();
                    saveState();
                    renderChatList();
                }
            }

            // Render Sidebar Chats List
            function renderChatList() {
                elements.chatList.innerHTML = '';
                state.chats.forEach(chat => {
                    const isActive = chat.id === state.activeChatId;
                    const item = document.createElement('div');
                    item.className = `group relative flex items-center justify-between px-3 py-2.5 rounded-lg text-sm cursor-pointer transition ${
                        isActive ? 'bg-gray-200/80 dark:bg-gray-700/80 font-medium' : 'hover:bg-gray-200/40 dark:hover:bg-gray-800/40'
                    }`;
                    item.onclick = () => {
                        state.activeChatId = chat.id;
                        saveState();
                        renderChatList();
                        renderMessages();
                        closeSidebarMobile();
                    };

                    item.innerHTML = `
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            <svg class="w-4 h-4 shrink-0 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                            <span class="truncate">${escapeHtml(chat.title)}</span>
                        </div>
                        <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="btn-rename p-1 hover:text-blue-500 text-gray-400" title="Rename"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
                            <button class="btn-delete p-1 hover:text-red-500 text-gray-400" title="Delete"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
                        </div>
                    `;

                    item.querySelector('.btn-rename').onclick = (e) => renameChat(chat.id, e);
                    item.querySelector('.btn-delete').onclick = (e) => deleteChat(chat.id, e);

                    elements.chatList.appendChild(item);
                });
            }

            // Render Messages Screen
            function renderMessages() {
                elements.messagesContainer.innerHTML = '';
                const activeChat = getActiveChat();
                
                if (!activeChat || activeChat.messages.length === 0) {
                    elements.messagesContainer.innerHTML = `
                        <div class="h-full flex flex-col items-center justify-center text-center p-6 text-gray-400">
                            <div class="w-12 h-12 rounded-full bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center mb-4 text-gemini-accent">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            </div>
                            <h2 class="text-xl font-medium text-gray-700 dark:text-gray-200 mb-1">Where knowledge begins</h2>
                            <p class="text-sm max-w-sm">Ask anything, generate creative content, or brainstorm ideas with Universal AI.</p>
                        </div>
                    `;
                    return;
                }

                activeChat.messages.forEach(msg => {
                    appendMessageNode(msg.role, msg.content);
                });
                
                scrollToBottom();
            }

            function appendMessageNode(role, content) {
                const wrapper = document.createElement('div');
                const isUser = role === 'user';
                wrapper.className = `flex gap-3 md:gap-4 max-w-3xl mx-auto ${isUser ? 'justify-end' : 'justify-start'}`;

                const formattedContent = typeof marked !== 'undefined' ? marked.parse(content || '') : escapeHtml(content);

                wrapper.innerHTML = `
                    ${!isUser ? `<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-sm">AI</div>` : ''}
                    <div class="${isUser ? 'bg-gemini-cardLight dark:bg-gemini-cardDark border border-gemini-borderLight dark:border-gemini-borderDark text-gray-800 dark:text-gray-100 rounded-2xl px-4 py-3 max-w-[85%]' : 'flex-1 prose dark:prose-invert max-w-none text-gray-800 dark:text-gray-100'}">
                        ${isUser ? escapeHtml(content) : `<div class="msg-body">${formattedContent}</div>`}
                    </div>
                    ${isUser ? `<div class="w-8 h-8 rounded-full bg-gray-300 dark:bg-gray-600 flex items-center justify-center text-gray-700 dark:text-gray-200 font-bold text-xs shrink-0">You</div>` : ''}
                `;

                elements.messagesContainer.appendChild(wrapper);
                return wrapper;
            }

            function scrollToBottom() {
                elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
            }

            // Form Submit / AI Response Stream Handling
            elements.chatForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                if (state.isGenerating) return;

                const text = elements.userInput.value.trim();
                if (!text) return;

                if (!state.apiKey) {
                    alert('Please enter an OpenRouter API Key in Settings.');
                    openSettings();
                    return;
                }

                const activeChat = getActiveChat();
                if (!activeChat) return;

                // Set Chat Title on First Message
                if (activeChat.messages.length === 0) {
                    activeChat.title = text.slice(0, 30) + (text.length > 30 ? '...' : '');
                    renderChatList();
                }

                // Add User Message
                activeChat.messages.push({ role: 'user', content: text });
                saveState();
                
                elements.userInput.value = '';
                elements.userInput.style.height = 'auto';
                renderMessages();

                // Setup Bot Stream Node
                state.isGenerating = true;
                elements.btnSend.disabled = true;

                const botWrapper = appendMessageNode('assistant', '');
                const bodyContainer = botWrapper.querySelector('.msg-body');
                bodyContainer.classList.add('cursor-blink');

                let fullText = '';

                try {
                    const apiMessages = [
                        { role: 'system', content: state.systemPrompt },
                        ...activeChat.messages
                    ];

                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${state.apiKey}`,
                            'Content-Type': 'application/json',
                            'HTTP-Referer': window.location.origin || 'https://localhost',
                            'X-Title': 'Universal AI Chat'
                        },
                        body: JSON.stringify({
                            model: state.model,
                            messages: apiMessages,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.error?.message || `HTTP Error ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed || trimmed.startsWith(':')) continue;
                            if (trimmed === 'data: [DONE]') break;

                            if (trimmed.startsWith('data: ')) {
                                try {
                                    const json = JSON.parse(trimmed.slice(6));
                                    const delta = json.choices?.[0]?.delta?.content || '';
                                    fullText += delta;
                                    bodyContainer.innerHTML = typeof marked !== 'undefined' ? marked.parse(fullText) : escapeHtml(fullText);
                                    scrollToBottom();
                                } catch (e) {
                                    // Skip malformed chunk
                                }
                            }
                        }
                    }

                } catch (err) {
                    console.error("Streaming error:", err);
                    fullText += `\n\n**Error:** ${err.message || 'Failed to generate response.'}`;
                    bodyContainer.innerHTML = typeof marked !== 'undefined' ? marked.parse(fullText) : escapeHtml(fullText);
                } finally {
                    bodyContainer.classList.remove('cursor-blink');
                    activeChat.messages.push({ role: 'assistant', content: fullText });
                    saveState();
                    state.isGenerating = false;
                    elements.btnSend.disabled = false;
                }
            });

            // Mobile Sidebar Toggles
            function openSidebarMobile() {
                elements.sidebar.classList.remove('-translate-x-full');
                elements.sidebarOverlay.classList.remove('hidden');
            }

            function closeSidebarMobile() {
                elements.sidebar.classList.add('-translate-x-full');
                elements.sidebarOverlay.classList.add('hidden');
            }

            elements.btnOpenSidebar.addEventListener('click', openSidebarMobile);
            elements.btnCloseSidebar.addEventListener('click', closeSidebarMobile);
            elements.sidebarOverlay.addEventListener('click', closeSidebarMobile);
            elements.btnNewChat.addEventListener('click', createNewChat);

            // Settings Modal Logic
            function openSettings() {
                elements.inputApiKey.value = state.apiKey;
                elements.inputModel.value = state.model;
                elements.inputSystemPrompt.value = state.systemPrompt;
                elements.settingsModal.classList.remove('hidden');
            }

            function closeSettings() {
                elements.settingsModal.classList.add('hidden');
            }

            elements.btnOpenSettings.addEventListener('click', openSettings);
            elements.btnCloseSettings.addEventListener('click', closeSettings);
            elements.btnSaveSettings.addEventListener('click', function() {
                state.apiKey = elements.inputApiKey.value.trim();
                state.model = elements.inputModel.value.trim() || 'deepseek/deepseek-r1:free';
                state.systemPrompt = elements.inputSystemPrompt.value.trim();
                saveState();
                elements.currentModelTag.textContent = state.model;
                closeSettings();
            });

            // Theme Toggle
            elements.btnToggleDark.addEventListener('click', function() {
                state.darkMode = !state.darkMode;
                if (state.darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                saveState();
            });

            // Utility Functions
            function escapeHtml(str) {
                return String(str || '')
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            // Initialize App
            init();
        })();
    </script>
</body>
